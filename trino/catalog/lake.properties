# Trino reads the SAME Iceberg tables as Spark — decoupled compute, one copy of data.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://nessie:19120/iceberg/main
iceberg.rest-catalog.warehouse=s3://warehouse/
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.aws-access-key=minio
s3.aws-secret-key=minio123
s3.region=us-east-1

# ------------------------------------------------------------------------------------------------
# Glossary
#   *.properties file       A Trino catalog config; the filename (lake) becomes the catalog name.
#   connector.name=iceberg  Use Trino's Iceberg connector to read/write Iceberg tables.
#   iceberg.catalog.type=rest  Resolve tables via an Iceberg REST catalog (Nessie).
#   rest-catalog.uri        Nessie REST endpoint Trino queries for table metadata.
#   rest-catalog.warehouse  Root S3 location for table data/metadata (matches Nessie + Terraform).
#   fs.native-s3.enabled    Use Trino's built-in S3 filesystem client.
#   s3.endpoint             Point the S3 client at MinIO instead of AWS.
#   s3.path-style-access    s3://host/bucket URL style required by MinIO.
#   s3.aws-access-key/secret Credentials for the object store (demo values).
#   Result                  Trino reads the SAME Iceberg tables as Spark — decoupled compute, one copy.
# ------------------------------------------------------------------------------------------------
