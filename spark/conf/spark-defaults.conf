# Spark tuned for the lakehouse (Topic 7). AQE is the L300 talking point.
# NOTE: spark-defaults.conf has no inline comments — a trailing "# ..." is read as part of the value.
spark.sql.adaptive.enabled                          true
spark.sql.adaptive.coalescePartitions.enabled       true
spark.sql.adaptive.skewJoin.enabled                 true
spark.sql.adaptive.localShuffleReader.enabled       true
spark.sql.autoBroadcastJoinThreshold                10485760
spark.sql.shuffle.partitions                        64

# Iceberg via Nessie REST catalog on S3/MinIO.
# Iceberg + AWS bundle + Kafka source aren't in the base image, so pull them at submit time.
spark.jars.packages           org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.2,org.apache.iceberg:iceberg-aws-bundle:1.5.2,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
# Image has no writable $HOME; keep Ivy's cache off /home/spark.
spark.jars.ivy                /tmp/.ivy2
spark.sql.extensions          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type   rest
spark.sql.catalog.lake.uri    http://nessie:19120/iceberg/main
spark.sql.catalog.lake.warehouse            s3://warehouse/
spark.sql.catalog.lake.s3.endpoint          http://minio:9000
spark.sql.catalog.lake.s3.path-style-access true

# ================================================================================================
# Glossary
#   spark-defaults.conf                 Key/value config auto-loaded by every Spark app.
#   spark.sql.adaptive.enabled          Master switch for AQE (runtime re-optimization).
#   coalescePartitions.enabled          AQE merges many small shuffle partitions into right-sized ones.
#   skewJoin.enabled                    AQE detects + splits skewed partitions so one hot key can't stall.
#   localShuffleReader.enabled          Reads shuffle data locally when a join is converted to broadcast.
#   autoBroadcastJoinThreshold          Max size (bytes) a table can be to auto-broadcast (10MB here).
#   shuffle.partitions                  Default post-shuffle partition count (AQE tunes down from this).
#   spark.sql.extensions                Registers Iceberg's SQL grammar (MERGE, time travel, etc.).
#   SparkCatalog + type=rest            Points Spark at an Iceberg REST catalog (Nessie).
#   catalog.lake.uri                    Nessie REST endpoint for the "lake" catalog namespace.
#   catalog.lake.warehouse              Root S3 location where Iceberg writes data/metadata.
#   s3.endpoint / path-style-access     Reach MinIO instead of AWS; path-style = s3://host/bucket URLs.
#   Broadcast join                      Small side copied to all executors; avoids shuffling the big side.
#   Shuffle                             Cross-node data redistribution between stages (joins/aggregations).
#   Data skew                           Uneven key distribution overloading one task/partition.
# ================================================================================================
